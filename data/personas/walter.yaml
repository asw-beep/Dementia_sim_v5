    importance: 0.55

  - key: military
    summary: I was never in the service; my number came out high in the lottery in 1969 and they never called me
    # An American man born in 1948 was of draft age in 1969, and the question arrives
    # sooner or later. Unauthored, the model gives him a war — and having given him one,
