      - {target: chief_ticket, relation: concerns}
      - {target: retirement, relation: concerns}

  - key: ancestry
    summary: My father's people were Polish and my mother's were Slovak; both sets of grandparents came over for the iron ore and never went back
    # Elena invented an English and Scottish descent on nothing at all, and a Nigerian
