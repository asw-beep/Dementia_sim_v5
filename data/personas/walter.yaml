  - key: food
    summary: My favourite food is my mother's golabki, the cabbage rolls; Dot made them for forty years and knew they were not the same
    keywords: [food, eat, favourite, favorite, meal, cook, cooking, golabki, cabbage, rolls, polish]
    subject: self
    attribute: favourite_food
