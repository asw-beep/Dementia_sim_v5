    keywords: [drink, drinks, drinking, drank, alcohol, beer, whisky, whiskey, sober, quit, stopped]
    subject: self
    attribute: drinking
    value: stopped in 1988
    importance: 0.6
    links:
      - {target: the_snowbank, relation: concerns}

  - key: fear
    summary: I am afraid of fire in a closed space; forty-four years below the waterline and it is the only thing that ever frightened me
