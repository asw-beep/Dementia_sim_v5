  - key: health
    summary: I am deaf in my left ear from the engine room and my knees are finished, and my hands have shaken for years
    # This one earns its place twice over. It is biography, so it must be authored or it
    # is invented — but it is also a *confound placed on purpose*. A deaf man asks you to
    # repeat things; so does an impaired one. Shaking hands look like a neurological
